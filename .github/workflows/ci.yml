name: CI

# One workflow, two jobs. `check` runs on everything; `release` runs after it
# and only when there is something new to publish, reusing the build that
# `check` already produced instead of doing it a second time.
#
# Releasing is driven by the version field in module.json: bump it, commit,
# push to master, and the release is published. Pushing a `v*` tag or running
# this workflow by hand also work.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (e.g. 1.1.0). Leave blank to use module.json.'
        required: false

permissions:
  contents: write

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Smoke Tests
        run: npm test

      - name: Build JS & CSS
        run: npm run build

      - name: Validate module.json and language files
        run: |
          node -e '
            const fs = require("fs");
            const module_ = JSON.parse(fs.readFileSync("module.json", "utf8"));
            const en = JSON.parse(fs.readFileSync("lang/en.json", "utf8"));
            const es = JSON.parse(fs.readFileSync("lang/es.json", "utf8"));

            for (const file of [...module_.esmodules, ...module_.styles]) {
              if (!fs.existsSync(file)) throw new Error(`module.json references a missing file: ${file}`);
            }
            for (const lang of module_.languages) {
              if (!fs.existsSync(lang.path)) throw new Error(`Missing language file: ${lang.path}`);
            }

            const flatten = (obj, prefix = "") => Object.entries(obj).reduce((acc, [key, value]) => {
              const path = prefix ? `${prefix}.${key}` : key;
              return Object.assign(acc, typeof value === "object" ? flatten(value, path) : { [path]: value });
            }, {});

            const missing = Object.keys(flatten(en)).filter(key => !(key in flatten(es)));
            if (missing.length) throw new Error(`es.json is missing keys: ${missing.join(", ")}`);

            console.log("module.json and language files are consistent");
          '

      - name: Keep the build for the release job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  release:
    name: Publish release
    needs: check
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide Whether There Is Anything To Ship
        id: scope
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          EMPTY="0000000000000000000000000000000000000000"

          # Anything other than an ordinary push is an explicit request, so ship.
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ -z "$BEFORE" ] || [ "$BEFORE" = "$EMPTY" ]; then
            echo "ship=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED="$(git diff --name-only "$BEFORE" "$GITHUB_SHA" || echo module.json)"
          echo "Changed files:"; echo "$CHANGED" | sed 's/^/  /'

          # A README or workflow edit is not worth pushing to every player.
          if echo "$CHANGED" | grep -qE '^(src/|lang/|module\.json|LICENSE)'; then
            echo "ship=true" >> "$GITHUB_OUTPUT"
          else
            echo "ship=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing that ships changed, so no release."
          fi

      - name: Resolve Version
        id: guard
        if: steps.scope.outputs.ship == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          INPUT="${{ github.event.inputs.version }}"
          BUMPED=false

          if [ -n "$INPUT" ]; then
            VERSION="$INPUT"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"
          else
            # Push to master. Use the manifest version if it is unpublished,
            # otherwise raise the patch number until we find a free one, so a
            # release never has to be prepared by hand.
            VERSION="$(node -p "require('./module.json').version")"
            while gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; do
              VERSION="$(node -e "
                const [major, minor, patch] = process.argv[1].split('.').map(Number);
                console.log([major, minor, (patch || 0) + 1].join('.'));
              " "$VERSION")"
              BUMPED=true
            done
          fi

          if [ -z "$VERSION" ]; then
            echo "Could not determine a version to release." >&2
            exit 1
          fi

          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION is already released."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing v$VERSION."
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"
          echo "bumped=$BUMPED" >> "$GITHUB_OUTPUT"

      - name: Restore the build from the check job
        if: steps.guard.outputs.released == 'false'
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Update module.json Version & Manifest URLs
        if: steps.guard.outputs.released == 'false'
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("module.json", "utf8"));
            const ver = process.env.VERSION;
            const repo = process.env.GITHUB_REPOSITORY;
            m.version = ver;
            m.url = `https://github.com/${repo}`;
            m.manifest = `https://github.com/${repo}/releases/latest/download/module.json`;
            m.download = `https://github.com/${repo}/releases/latest/download/module.zip`;
            fs.writeFileSync("module.json", JSON.stringify(m, null, 2) + "\n");
            console.log(`module.json set to ${ver}`);
          '

      - name: Commit the Bumped Version Back To master
        if: steps.guard.outputs.released == 'false' && steps.guard.outputs.bumped == 'true' && github.ref == 'refs/heads/master'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add module.json
          # Pushes made with GITHUB_TOKEN do not start another run, and the
          # marker makes that explicit for anyone reading the history.
          git commit -m "chore: release v$VERSION [skip ci]"
          git push origin HEAD:master

      - name: Create Zip Artifact
        if: steps.guard.outputs.released == 'false'
        run: zip -r module.zip module.json README.md LICENSE dist/ lang/

      - name: Upload Release Assets
        if: steps.guard.outputs.released == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          generate_release_notes: true
          files: |
            module.json
            module.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
