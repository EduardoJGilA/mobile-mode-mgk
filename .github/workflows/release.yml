name: Release Module

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Lint
        run: npm run lint

      - name: Smoke Tests
        run: npm test

      - name: Build JS & CSS
        run: npm run build

      - name: Extract Version
        id: get_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$VERSION" = "$GITHUB_REF" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Update module.json Version & Manifest URLs
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("module.json", "utf8"));
            const ver = process.env.VERSION;
            m.version = ver;
            m.url = `https://github.com/${process.env.GITHUB_REPOSITORY}`;
            m.manifest = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/latest/download/module.json`;
            m.download = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/v${ver}/module.zip`;
            fs.writeFileSync("module.json", JSON.stringify(m, null, 2));
          '

      - name: Create Zip Artifact
        run: |
          zip -r module.zip module.json README.md LICENSE dist/ lang/

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            module.json
            module.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
